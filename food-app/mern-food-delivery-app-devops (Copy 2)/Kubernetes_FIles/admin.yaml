apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  labels:
    app: admin
spec:
  replicas: 1          # Desired number of concurrent application instances
  selector:
    matchLabels:
      app: admin      # Tells the deployment which pods belong to it
  template:
    metadata:
      labels:
        app: admin    # Labels injected into the pods
    spec:
      containers:
      - name: admin
        image: silversoul007/mern:admin
        ports:
        - containerPort: 5174

---

apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - protocol: TCP
      port: 5174
      targetPort: 5174