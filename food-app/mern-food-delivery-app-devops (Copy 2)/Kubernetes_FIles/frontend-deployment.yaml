apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1         # Desired number of concurrent application instances
  selector:
    matchLabels:
      app: frontend      # Tells the deployment which pods belong to it
  template:
    metadata:
      labels:
        app: frontend    # Labels injected into the pods
    spec:
      containers:
      - name: frontend
        image: silversoul007/mern:frontend
        ports:
        - containerPort: 5173

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173