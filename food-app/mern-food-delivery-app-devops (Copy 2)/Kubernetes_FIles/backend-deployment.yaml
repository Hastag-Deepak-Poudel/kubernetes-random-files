apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1          # Desired number of concurrent application instances
  selector:
    matchLabels:
      app: backend      # Tells the deployment which pods belong to it
  template:
    metadata:
      labels:
        app: backend    # Labels injected into the pods
    spec:
      containers:
      - name: backend
        image: silversoul007/mern:backend
        ports:
        - containerPort: 4000
        env: 
        - name: JWT_SECRET
          value: "YGvykuiR0te7HPbBt0rESBS2wvZLYQSxl9oLOQLEdtr"
        - name: MONGODB_URI
          value: "mongodb://admin:securepassword@mongodb:27017"

---

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000